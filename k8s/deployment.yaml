apiVersion: apps/v1
kind: Deployment

metadata:
  name: 5xo
  namespace: 5xo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: 5xo

  template:

    metadata:
      labels:
        app: 5xo

    spec:

      containers:

      - name: 5xo

        image: 5xo:latest

        imagePullPolicy: Never

        ports:

        - containerPort: 5000

        readinessProbe:

          httpGet:
            path: /
            port: 5000

          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:

          httpGet:
            path: /
            port: 5000

          initialDelaySeconds: 15
          periodSeconds: 10

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"